# One-click hosting on Render: https://render.com/deploy?repo=https://github.com/jamiaankit-ux/Power_sector_guru
services:
  - type: web
    name: power-academy
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npx prisma db push --skip-generate && npm run build && npm run db:seed
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: power-academy-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_LEARNER
        value: "false"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_TEST_PAYMENTS
        value: "false"
      - key: TAX_PERCENT
        value: "18"
      - key: SMS_PROVIDER
        value: console
      - key: EMAIL_PROVIDER
        value: console
      - key: APP_URL
        sync: false
      # Optional add-ons (leave empty until you have them; see README)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TUTOR_DAILY_LIMIT
        value: "30"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

databases:
  - name: power-academy-db
    plan: free
    region: singapore
    databaseName: power_academy
