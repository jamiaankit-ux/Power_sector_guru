name: Android test app

# Builds an installable test APK of the Android app (not the Play Store release).
# Run it from GitHub → Actions → "Android test app" → Run workflow, then download "power-sector-academy-apk".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "native-shell/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-test-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/android-test-build.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: power-sector-academy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
