name: Android test app

# Builds installable test APKs of the Android apps (not the Play Store release):
#   power-sector-academy-apk  the learner app
#   psa-admin-apk             the owner's admin app, which opens straight into /admin
# Run it from GitHub → Actions → "Android test app" → Run workflow, then download the files from the run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "native-shell/**"
      - "capacitor.config.ts"
      - "package.json"
      - "scripts/android-admin-variant.sh"
      - ".github/workflows/android-test-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "scripts/android-admin-variant.sh"
      - ".github/workflows/android-test-build.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: learner
            artifact: power-sector-academy-apk
            file: power-sector-academy.apk
          - variant: admin
            artifact: psa-admin-apk
            file: psa-admin.apk
    env:
      APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts
      - name: Switch to the admin app
        if: matrix.variant == 'admin'
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          ./scripts/android-admin-variant.sh
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
