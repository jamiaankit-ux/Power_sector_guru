name: Lecture voice

# Makes the narration audio for lecture videos (Indian English male voice) and saves it back to the branch.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "lecture-video/**/script.json"
      - "lecture-video/tts.py"
      - ".github/workflows/lecture-voice.yml"

permissions:
  contents: write

concurrency:
  group: lecture-voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts==7.3.1
      - name: Speak every script
        run: python lecture-video/tts.py $(git ls-files 'lecture-video/**/script.json')
      - name: Save the audio to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add lecture-video
          git diff --cached --quiet && exit 0
          git commit -m "Narration audio [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
