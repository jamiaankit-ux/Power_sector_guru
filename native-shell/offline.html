<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Offline</title>
<style>body{margin:0;background:#0a0f1c;color:#e2e8f0;font-family:system-ui;padding:calc(24px + env(safe-area-inset-top)) 16px 24px}h1{font-size:20px;margin:8px 0}p{color:#94a3b8;font-size:14px}
.b{background:#1d4ed8;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600}.c{display:flex;gap:12px;align-items:center;background:#111a2e;border:1px solid #1e293b;border-radius:14px;padding:14px;margin-top:10px}
.c div{flex:1;min-width:0}.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{color:#94a3b8;font-size:12px}video{width:100%;border-radius:14px;background:#000;margin-top:12px}.w{position:relative}.w span{position:absolute;left:14px;top:22px;font-size:11px;color:rgba(255,255,255,.3);pointer-events:none}</style></head>
<body><div style="font-size:40px">⚡</div><h1 id="h">Connecting…</h1><p id="m">Opening Power Sector Academy. The first open after a quiet period can take up to a minute.</p>
<button class="b" id="r">Try again</button><div id="player"></div><div id="list"></div>
<script>
// Where the app goes when the connection is back. Written by scripts/app-shell.mjs (learner app: site home, admin app: /admin).
var START_URL = "https://power-academy.onrender.com/";
// This page is shown whenever the first page fails to load: no internet, or the server is still waking up.
// It keeps checking and opens the app by itself as soon as the server answers.
(function () {
  var h = document.getElementById("h"), m = document.getElementById("m"), tries = 0, opens = 0;
  try { var o = JSON.parse(sessionStorage.getItem("opens") || "[]").filter(function (t) { return Date.now() - t < 180000; }); opens = o.length; } catch (e) { o = []; }
  function say(offline) {
    h.textContent = offline ? "You are offline" : "Connecting…";
    m.textContent = offline ? "Your saved videos still play. Everything else needs an internet connection." : "Opening Power Sector Academy. The first open after a quiet period can take up to a minute.";
  }
  function open() { try { o.push(Date.now()); sessionStorage.setItem("opens", JSON.stringify(o)); } catch (e) {} location.replace(START_URL); }
  function check() {
    tries++;
    if (!navigator.onLine) { say(true); return setTimeout(check, 4000); }
    if (opens >= 10) { h.textContent = "Could not open the app"; m.textContent = "The server did not answer. Please tap Try again in a minute."; return; }
    say(false);
    fetch(new URL("/icon.svg?t=" + Date.now(), START_URL), { mode: "no-cors", cache: "no-store" })
      .then(function () { setTimeout(open, opens ? 5000 : 0); })
      .catch(function () { if (tries > 4) say(true); setTimeout(check, 4000); });
  }
  document.getElementById("r").onclick = function () { try { sessionStorage.removeItem("opens"); } catch (e) {} location.replace(START_URL); };
  setTimeout(check, 1200);
})();
</script>
<script>
// Lists and plays the videos saved by the app (see src/lib/offline.ts). They live in the app's private storage.
(async function () {
  var C = window.Capacitor, F = C && C.Plugins && C.Plugins.Filesystem, list = document.getElementById("list");
  if (!F) return;
  try {
    var r = await F.readFile({ path: "offline/index.json", directory: "LIBRARY", encoding: "utf8" });
    var items = JSON.parse(r.data).filter(function (i) { return i.expires > Date.now(); });
    if (!items.length) { list.innerHTML = '<p style="margin-top:20px">No saved videos. When you are online, open a lesson and tap “Download for offline”.</p>'; return; }
    items.forEach(function (i) {
      var c = document.createElement("div"); c.className = "c";
      var d = document.createElement("div"), t = document.createElement("div"), s = document.createElement("div");
      t.className = "t"; t.textContent = i.title; s.className = "s"; s.textContent = Math.round(i.size / 1e6) + " MB";
      d.appendChild(t); d.appendChild(s);
      var b = document.createElement("button"); b.className = "b"; b.textContent = "Play";
      b.onclick = async function () {
        var u = await F.getUri({ path: i.file, directory: "LIBRARY" });
        var p = document.getElementById("player"); p.innerHTML = "";
        var w = document.createElement("div"); w.className = "w";
        var v = document.createElement("video"); v.controls = true; v.autoplay = true; v.playsInline = true; v.setAttribute("controlsList", "nodownload"); v.src = C.convertFileSrc(u.uri);
        var m = document.createElement("span"); m.textContent = i.owner || "";
        w.appendChild(v); w.appendChild(m); p.appendChild(w); window.scrollTo(0, 0);
      };
      c.appendChild(d); c.appendChild(b); list.appendChild(c);
    });
  } catch (e) {}
})();
</script></body></html>
